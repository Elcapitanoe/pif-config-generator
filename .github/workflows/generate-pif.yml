name: Automated PIF Profile Generator

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: pif-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/

  check-upstream:
    name: Check Upstream Releases
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      results: ${{ steps.check.outputs.results }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          pip install -e .

      - name: Query upstream updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pif-gen check --state-dir state

  generate-and-publish:
    name: Generate and Release Profiles
    needs: check-upstream
    if: needs.check-upstream.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        release: ${{ fromJson(needs.check-upstream.outputs.results) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          pip install -e .

      - name: Generate JSON profiles
        run: |
          pif-gen build \
            --channel "${{ matrix.release.channel }}" \
            --assets-json '${{ toJson(matrix.release.assets) }}' \
            --output-dir output \
            --manifest output/manifest.txt

      - name: Validate generated JSON files
        run: |
          for file in output/*.json; do
            [ -e "$file" ] || continue
            python -m json.tool "$file" > /dev/null
          done

      - name: Update tracker state
        run: |
          mkdir -p state
          echo "${{ matrix.release.tag }}" > "state/last_${{ matrix.release.channel }}_tag.txt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_${{ matrix.release.channel }}_tag.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(tracker): update ${{ matrix.release.channel }} tag to ${{ matrix.release.tag }}"
            git pull --rebase
            git push
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pif-gen publish \
            --repo "${{ github.repository }}" \
            --tag "${{ matrix.release.tag }}" \
            --channel "${{ matrix.release.channel }}" \
            --manifest output/manifest.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pif-profiles-${{ matrix.release.channel }}-${{ matrix.release.tag }}
          path: output/
          retention-days: 30
